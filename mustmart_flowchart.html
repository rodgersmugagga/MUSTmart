<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUSTmart Verification and Listing Approval Flowchart</title>
<style>
:root{--bg:#ffffff;--fg:#1a1d2e;--mut:#4a4f66;--line:#dfe2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172a;--fg:#eef0f8;--mut:#b4b9d0;--line:#2c3150}}
:root[data-theme="dark"]{--bg:#14172a;--fg:#eef0f8;--mut:#b4b9d0;--line:#2c3150}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{padding:20px 24px;border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:22px}
p{margin:0;color:var(--mut);font-size:14px}
.wrap{padding:16px 24px;overflow-x:auto}
.sheet{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line)}
footer{padding:12px 24px 24px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>

="544" text-anchor="middle">End</text><rect x="240" y="546" width="280" height="48"/><text x="380" y="567" text-anchor="middle">Business verified (Verified badge);</text><text x="380" y="581" text-anchor="middle">owner notified</text><rect x="250" y="630" width="260" height="40"/><text x="380" y="654" text-anchor="middle">Owner submits a listing</text><rect x="250" y="700" width="260" height="40"/><text x="380" y="724" text-anchor="middle">Listing status: Pending review</text><polygon points="290,830 380,785 470,830 380,875"/><text x="380" y="834" text-anchor="middle" font-weight="700">Admin decision</text><rect x="545" y="802" width="170" height="56"/><text x="630" y="820" text-anchor="middle">Listing rejected;</text><text x="630" y="834" text-anchor="middle">reason recorded,</text><text x="630" y="848" text-anchor="middle">returned to owner</text><rect x="250" y="900" width="260" height="40"/><text x="380" y="924" text-anchor="middle">Listing is Live and searchable</text><rect x="310" y="980" width="140" height="40" rx="20"/><text x="380" y="1004" text-anchor="middle">End</text><polyline points="380,60 380,96" fill="none" marker-end="url(#a)"/><polyline points="380,144 380,176" fill="none" marker-end="url(#a)"/><polyline points="380,224 380,250" fill="none" marker-end="url(#a)"/><polyline points="380,290 380,320" fill="none" marker-end="url(#a)"/><polyline points="380,360 380,405" fill="none" marker-end="url(#a)"/><polyline points="290,450 215,450" fill="none" marker-end="url(#a)"/><text x="252" y="443" text-anchor="middle" font-size="11" class="lb">request info</text><polyline points="470,450 545,450" fill="none" marker-end="url(#a)"/><text x="507" y="443" text-anchor="middle" font-size="11" class="lb">reject</text><polyline points="630,478 630,520" fill="none" marker-end="url(#a)"/><polyline points="380,495 380,546" fill="none" marker-end="url(#a)"/><text x="388" y="522" text-anchor="start" font-size="11" class="lb">approve</text><polyline points="380,594 380,63
